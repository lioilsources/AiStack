# Cloudflare Tunnel config — AiStack on DGX Spark
# Mounted into the container at /etc/cloudflared/

tunnel: f3cb3ac1-d9fa-4c78-9d87-ff3cab6c7051
credentials-file: /etc/cloudflared/f3cb3ac1-d9fa-4c78-9d87-ff3cab6c7051.json

ingress:
  # gen-queue — NIM image job queue (FLUX Kontext + FLUX Schnell)
  # Must come before the general llm.ol1n.com rule.
  - hostname: llm.ol1n.com
    path: /nim/.*
    service: http://gen-queue:8091
    originRequest:
      connectTimeout: 30s
      keepAliveTimeout: 300s

  # llm.ol1n.com → AiStack Go gateway (LLM + OCR routing)
  - hostname: llm.ol1n.com
    service: http://gateway:8080
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 30s
      noHappyEyeballs: false
      keepAliveTimeout: 300s
      keepAliveConnections: 10
      httpHostHeader: llm.ol1n.com
      originServerName: ""

  # code.ol1n.com → swarm-litellm v síti ai (přímý přístup, bez host bridge).
  - hostname: code.ol1n.com
    service: http://swarm-litellm:4000
    originRequest:
      connectTimeout: 30s

  # comfyui.ol1n.com → nativní ComfyUI běžící na hostu (:8188).
  # cloudflared je v kontejneru, takže host se reachne přes host.docker.internal
  # (vyžaduje extra_hosts host-gateway v docker-compose.yml).
  # CF Access App: 0929e4dd-6717-4933-826e-3b6edc44f13b (stejný service token jako llm.ol1n.com)
  - hostname: comfyui.ol1n.com
    service: http://host.docker.internal:8188
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 30s
      keepAliveTimeout: 300s
      access:
        required: true
        teamName: ol1n
        audTag:
          - 4bc655c0fec0da2ff6a4922a9fc042db2646efb020054735c365ac4cbad29a0b

  # chat.ol1n.com → knihovní RAG chatbot (WorldLibraryProject rag/server.py :8090).
  # Server běží na SPARK hostu → host.docker.internal (stejný vzor jako ComfyUI);
  # pokud poběží na M2, nahraď service za http://<M2-LAN-IP>:8090.
  #
  # Jednorázově před prvním použitím:
  #   1. DNS route:  cloudflared tunnel route dns f3cb3ac1-d9fa-4c78-9d87-ff3cab6c7051 chat.ol1n.com
  #      (nebo: docker run --rm -v $PWD/cloudflared:/etc/cloudflared cloudflare/cloudflared:latest
  #             tunnel --config /etc/cloudflared/config.yml route dns f3cb3ac1-d9fa-4c78-9d87-ff3cab6c7051 chat.ol1n.com)
  #   2. Zero Trust dashboard → Access App pro chat.ol1n.com, do audTag níže doplnit
  #      její AUD a odkomentovat access blok (do té doby je hostname veřejný!).
  #   3. docker compose -f deploy/docker-compose.yml restart cloudflared-1 cloudflared-2
  - hostname: chat.ol1n.com
    service: http://host.docker.internal:8090
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 30s
      keepAliveTimeout: 300s
      access:
        required: true
        teamName: ol1n
        audTag:
          - 9d11ce1989d2864e6e3fe9b142100d839e94b3c39f325f281776171881485e07

  - service: http_status:404
