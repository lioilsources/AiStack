models:
  dev:
    compose_file: /home/ol1n/deploy/AiStack/deploy/docker-compose.llm.yaml
    services: [dev, litellm]
    health_url: http://dev:8000/v1/models
    health_timeout: 360s
    alias: dev

  lab:
    compose_file: /home/ol1n/deploy/AiStack/deploy/docker-compose.llm.yaml
    services: [lab, litellm]
    health_url: http://lab:8000/v1/models
    health_timeout: 660s
    alias: lab

  translate:
    compose_file: /home/ol1n/deploy/AiStack/deploy/docker-compose.translate.yaml
    services: [translate]
    health_url: http://translate:8000/v1/models
    health_timeout: 360s
    alias: translate

  tune-builder:
    compose_file: /home/ol1n/deploy/AiStack/deploy/docker-compose.tune-image.yaml
    services: [tune-builder]
    health_url: http://tune-builder:8000/v1/models
    alias: tune-builder

  swarm:
    compose_file: /home/ol1n/deploy/AiStack/deploy/docker-compose.swarm.yaml
    health_url: http://swarm-litellm:4000/health
    health_timeout: 600s
    alias: swarm

  swarm-director:
    compose_file: /home/ol1n/deploy/AiStack/deploy/docker-compose.swarm.yaml
    services: [swarm-director]
    health_url: http://swarm-director:8000/v1/models
    health_timeout: 600s
    alias: swarm-director

  ocr:
    compose_file: /home/ol1n/deploy/AiStack/deploy/docker-compose.ocr.yaml
    health_url: http://ocr-api:8003/health
    alias: ocr

  # Audio — hudba (ACE-Step 1.5) a SFX (MOSS-SoundEffect / Stable Audio Open).
  # Orchestrátor `audio` se nespravuje: nemá váhy, drží frontu a musí přežít
  # shození modelů. Řídí se jen kontejnery s modely.
  audio-music:
    compose_file: /home/ol1n/deploy/AiStack/deploy/docker-compose.audio.yaml
    services: [audio-music]
    health_url: http://audio-music:8001/health
    health_timeout: 900s
    alias: audio-music

  audio-sfx:
    compose_file: /home/ol1n/deploy/AiStack/deploy/docker-compose.audio.yaml
    services: [audio-sfx]
    health_url: http://audio-sfx:8002/health
    health_timeout: 600s
    alias: audio-sfx
