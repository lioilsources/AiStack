services:
  ocr-api:
    image: ghcr.io/ol1n/ocr-api:latest
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      REDIS_URL: redis://ocr-redis:6379
      # model dir name matches download_ocr_models.sh naming: org__repo
      OCR_MODEL: ${OCR_MODEL:-dh-unibe__trocr-kurrent}
      OCR_MODEL_DIR: /models
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - ${CACHE_OCR}:/models
    networks:
      - internal
    depends_on:
      ocr-redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ocr-redis:
    image: redis:7-alpine
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  internal:
    external: true
    name: ai
