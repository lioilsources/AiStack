# OCR module: Qwen2.5-VL-7B-Instruct
# Handles: multilingual text, handwritten text, mixed scripts
#
# Standalone: docker compose -f deploy/docker-compose.ocr.yaml up -d --build
# Env vars:   HF_TOKEN, CACHE_QWEN_VL, OCR_MODEL_ID

services:

  ocr-api:
    build:
      context: ../services/ocr-api
    image: aistack/ocr-api:latest
    container_name: ai-ocr-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
      - OCR_MODEL_ID=${OCR_MODEL_ID:-Qwen/Qwen2.5-VL-7B-Instruct}
    volumes:
      - ${CACHE_QWEN_VL}:/root/.cache/huggingface
    shm_size: 16gb
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

networks:
  internal:
    driver: bridge
