services:
  ocr-api:
    image: nvcr.io/nim/nvidia/nemotron-ocr-v2:1.4
    container_name: ocr-api
    restart: unless-stopped
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - ${CACHE_OCR}:/opt/nim/.cache
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

networks:
  internal:
    external: true
    name: ai
