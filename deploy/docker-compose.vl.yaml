# VL (vision-language) soudce — Qwen2.5-VL-7B-Instruct na vLLM, v LiteLLM alias `vl`.
# Hodnotí vyrenderované náhledy shaderů (MirrorBooth ShaderGen v2, Fáze 5 vision_ranker)
# a je kandidát B4 v PLAN-model-bench.md. Váhy už jsou v cache/qwen-vl (tune-validator
# i OCR je sdílí, HF_HUB_OFFLINE=1 jen čte).
#
# ~20 GiB (util 0.18). Vedle ComfyUI (52) se vejde jen s malým textovým modelem
# (Nano-30B, 18) — ne vedle qwen36/translate (36).
#
#   make up-vl  /  make down-vl
services:
  vl:
    image: vllm/vllm-openai:${SWARM_VLLM_VERSION}
    container_name: vl
    command: >
      Qwen/Qwen2.5-VL-7B-Instruct
      --served-model-name vl
      --gpu-memory-utilization 0.18
      --max-model-len 16384
      --max-num-seqs 4
      --limit-mm-per-prompt '{"image": 3}'
      --trust-remote-code
    environment:
      - HF_HUB_OFFLINE=1
    volumes:
      - ${CACHE_QWEN_VL}:/root/.cache/huggingface/hub:ro
    ports:
      - "127.0.0.1:8041:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [ai]
    restart: "no"

networks:
  ai:
    external: true
    name: ai
