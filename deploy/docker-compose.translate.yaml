# Translate module: nvidia/Qwen3-32B-FP4 (NVFP4) přes TensorRT-LLM pro hromadné překlady.
#
# Standalone: docker compose --env-file .env -f deploy/docker-compose.translate.yaml up -d
#           → nebo: make up-translate
#
# Backend: TensorRT-LLM (trtllm-serve, pytorch backend) — nativní Blackwell FP4
#          (nvfp4_gemm cutlass/cublaslt, attn_backend TRTLLM). Dříve vLLM — viz
#          záloha docker-compose.translate.vllm.bak. Pozn.: měřeno bylo vLLM o něco
#          rychlejší (memory-bound LPDDR5X), TRT nasazen na vyžádání.
#
# Model: sdílí HF cache s vLLM (CACHE_TRANSLATE, RO mount). trtllm-serve dostává
#        LOKÁLNÍ cestu ke snapshotu (ne HF handle) + --tokenizer — jinak by tokenizer
#        loader šel online a s HF_HUB_OFFLINE=1 spadl na tokenizer=None.
# Engine: TRT staví engine při startu (~4 min) → start_period 600s.
#
# Paměťový profil (měřeno 31. 8. 2026, 121,7 GiB unified):
#   výchozí (batch 16, KV 0,5)  → 57 GiB, obohacení korpusu 18,9 chunku/min
#   úsporný (batch 8,  KV 0,2)  → ~36 GiB, 9,7/min — ale vejde se vedle ComfyUI (52 GiB)
# Přepíná se proměnnými prostředí, ne druhým compose souborem, aby se
# nemusel duplikovat celý příkaz trtllm-serve a nemohl zestárnout:
#   TRANSLATE_MAX_BATCH=8 TRANSLATE_KV_FRACTION=0.2 \
#     docker compose -f deploy/docker-compose.translate.yaml --env-file .env \
#     up -d --force-recreate translate
# (proměnná z shellu přebíjí --env-file). Pozor: KV frakce je podíl VOLNÉ
# paměti při startu, takže záleží, co v tu chvíli běží — a spolehlivě jen
# na čerstvě restartovaném ComfyUI (viz jeho vlastní bobtnání, comfyui.md).
#
# --max_seq_len/--max_num_tokens (16384) NEJDOU přes batch/KV zeštíhlit —
# měřeno 16. 9. 2026: TRT-LLM svůj profilovací dry-run (peak memory probe
# před tím, než spočítá KV frakci) škáluje podle TĚCHTO dvou stropů, ne podle
# batch. TRANSLATE_MAX_BATCH=4 + KV_FRACTION=0.1 tak paradoxně spotřebovaly
# VÍC než běžný úsporný profil (batch/KV samy o sobě nešetří nic, jen mění,
# kolik z toho, co profiling stejně sáhne, zůstane jako trvalý KV pool).
# TRANSLATE_MAX_SEQ_LEN/TRANSLATE_MAX_NUM_TOKENS jsou proto vlastní knoby —
# 8192 stačí s rezervou (Knihovníkův kontext v praxi ~3–5k: systémový prompt
# ~600 tok + top_k 5 pasáží × ≤450 tok + dotaz), 16384 je jen bezpečná
# výchozí hodnota pro `make up-translate` (hromadné obohacení může chtít víc).

services:

  translate:
    image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc20
    container_name: translate
    restart: unless-stopped
    command:
      - bash
      - -c
      - >
        trtllm-serve /root/.cache/huggingface/hub/models--nvidia--Qwen3-32B-FP4/snapshots/16426c6eb87be9e27c14cc9fb318f9c7a5f8588c
        --served_model_name translate
        --tokenizer /root/.cache/huggingface/hub/models--nvidia--Qwen3-32B-FP4/snapshots/16426c6eb87be9e27c14cc9fb318f9c7a5f8588c
        --host 0.0.0.0
        --port 8000
        --backend pytorch
        --max_batch_size ${TRANSLATE_MAX_BATCH:-16}
        --max_seq_len ${TRANSLATE_MAX_SEQ_LEN:-16384}
        --max_num_tokens ${TRANSLATE_MAX_NUM_TOKENS:-16384}
        --kv_cache_free_gpu_memory_fraction ${TRANSLATE_KV_FRACTION:-0.5}
        --kv_cache_dtype auto
        --trust_remote_code
    environment:
      - HF_HUB_OFFLINE=1
    ports:
      - "127.0.0.1:8004:8000"
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    shm_size: 16gb
    volumes:
      - ${CACHE_TRANSLATE}:/root/.cache/huggingface/hub:ro
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

networks:
  internal:
    external: true
    name: ai
