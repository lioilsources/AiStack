# Translate module: Qwen3-32B DGX Spark NIM pro hromadné překlady.
#
# Standalone: docker compose --env-file .env -f deploy/docker-compose.translate.yaml up -d
#           → nebo: make up-translate
#
# Paměť: NIM dgx-spark varianta použije NVFP4 automaticky (~15–18 GB).
# Sdílí GPU pool s 'dev' — bez rebootu může být těsno; nejdřív: make down-llm.

services:

  translate:
    image: nvcr.io/nim/qwen/qwen3-32b-dgx-spark:1.1.0-variant
    container_name: translate
    restart: unless-stopped
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_SERVED_MODEL_NAME=translate
      - NIM_MAX_MODEL_LEN=4096
      - NIM_GPU_MEMORY_UTILIZATION=0.22
    ports:
      - "127.0.0.1:8004:8000"
    shm_size: 16gb
    volumes:
      - ${CACHE_TRANSLATE}:/opt/nim/.cache
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

networks:
  internal:
    external: true
    name: ai
