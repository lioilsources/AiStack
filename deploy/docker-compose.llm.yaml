# LLM module: vLLM lab + vLLM dev + LiteLLM gateway
#
# Standalone: docker compose -f deploy/docker-compose.llm.yaml up -d
# Env vars:   HF_TOKEN, VLLM_VERSION, HF_MODEL_LAB, HF_MODEL_DEV, CACHE_LAB, CACHE_DEV

services:

  lab:
    # Nepoužívá se (dev jede jako jediná instance). Profile 'lab' brání náhodnému startu přes `up`.
    profiles: ["lab"]
    image: nvcr.io/nvidia/vllm:${VLLM_VERSION}
    container_name: ai-lab
    restart: unless-stopped
    command: >
      vllm serve ${HF_MODEL_LAB}
      --gpu-memory-utilization 0.7
      --max-model-len 131072
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: 48gb
    volumes:
      - ${CACHE_LAB}:/root/.cache/huggingface
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  dev:
    # Qwen3-32B-AWQ (dense 32B, AWQ 4-bit, ~18 GB weights).
    # 100+ jazyků vč. čínštiny, arabštiny, svahilštiny → nasazeno pro překlad.
    # Paměť: GB10 unified pool sdílí s ComfyUI+FLUX (~24 GB). Pevný --kv-cache-memory-bytes =
    # order-independent cap (model ~18 + KV 8 + ~2 overhead ≈ 28 GiB), zbytek pool zůstane ComfyUI.
    # --gpu-memory-utilization slouží jen jako startup guard (free >= util*total = 0.40*127 ≈ 51 GiB).
    # Nativní kontextové okno 40960 tokenů (> 32k; opencode posílá max_tokens 32000 → vyhovuje).
    # Thinking vypnuto by default v litellm (enable_thinking: false); klient může zapnout.
    image: vllm/vllm-openai:v0.20.0
    container_name: ai-dev
    restart: unless-stopped
    command: >
      ${HF_MODEL_DEV}
      --served-model-name dev
      --kv-cache-memory-bytes 8589934592
      --gpu-memory-utilization 0.40
      --max-model-len 40960
      --max-num-seqs 8
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --trust-remote-code
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
    ports:
      - "127.0.0.1:8001:8000"
    shm_size: 16gb
    volumes:
      - ${CACHE_DEV}:/root/.cache/huggingface/hub
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai-litellm
    restart: unless-stopped
    command: --config /app/config.yaml --port 4000
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      dev:
        condition: service_healthy

networks:
  internal:
    driver: bridge
    name: ai
