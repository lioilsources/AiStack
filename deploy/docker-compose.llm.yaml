# LLM module: vLLM lab + vLLM dev + LiteLLM gateway
#
# Standalone: docker compose -f deploy/docker-compose.llm.yaml up -d
# Env vars:   HF_TOKEN, VLLM_VERSION, HF_MODEL_LAB, HF_MODEL_DEV, CACHE_LAB, CACHE_DEV

services:

  lab:
    # Nepoužívá se (dev jede jako jediná instance). Profile 'lab' brání náhodnému startu přes `up`.
    profiles: ["lab"]
    image: nvcr.io/nvidia/vllm:${VLLM_VERSION}
    container_name: ai-lab
    restart: unless-stopped
    command: >
      vllm serve ${HF_MODEL_LAB}
      --gpu-memory-utilization 0.7
      --max-model-len 131072
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: 48gb
    volumes:
      - ${CACHE_LAB}:/root/.cache/huggingface
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  dev:
    # Nemotron-3-Nano-30B-A3B-NVFP4 (nemotron_h hybrid Mamba-MoE, 3.5B aktiv).
    # MoE → dekódování čte ~5 GB místo 31 GB → na GB10 řádově rychlejší než dense Gemma-4.
    # Standardní vLLM image (v0.20.0 podporuje nemotron_h); entrypoint = ["vllm","serve"] → command bez prefixu.
    # Reasoning model: nano_v3 parser oddělí <think> do reasoning_content, klient dostane čistý content.
    image: vllm/vllm-openai:v0.20.0
    container_name: ai-dev
    restart: unless-stopped
    command: >
      ${HF_MODEL_DEV}
      --served-model-name dev
      --gpu-memory-utilization 0.20
      --max-model-len 32768
      --max-num-seqs 8
      --kv-cache-dtype fp8
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser-plugin /parsers/nano_v3_reasoning_parser.py
      --reasoning-parser nano_v3
      --trust-remote-code
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
      - VLLM_USE_FLASHINFER_MOE_FP4=1
      - VLLM_FLASHINFER_MOE_BACKEND=throughput
    ports:
      - "127.0.0.1:8001:8000"
    shm_size: 16gb
    volumes:
      # swarm-nano cache má 'models--...' v rootu (ne v hub/), proto mount přímo do hub/.
      - ${CACHE_DEV}:/root/.cache/huggingface/hub
      - ./parsers:/parsers:ro
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai-litellm
    restart: unless-stopped
    command: --config /app/config.yaml --port 4000
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      dev:
        condition: service_healthy

networks:
  internal:
    driver: bridge
    name: ai
