# LLM module: vLLM lab + vLLM dev + LiteLLM gateway
#
# Standalone: docker compose -f deploy/docker-compose.llm.yaml up -d
# Env vars:   HF_TOKEN, VLLM_VERSION, HF_MODEL_LAB, HF_MODEL_DEV, CACHE_LAB, CACHE_DEV
#             Překlady: HF_MODEL_TRANSLATE, CACHE_TRANSLATE (docker-compose.translate.yaml)

services:

  lab:
    # gpt-oss-120b — nejsilnější model, spouštět jen na vyžádání (make up-lab / profile: lab).
    # llm-lab alias v LiteLLM míří primárně sem, fallbackuje na dev (Gemma) a další stacky.
    profiles: ["lab"]
    image: nvcr.io/nvidia/vllm:${VLLM_VERSION}
    container_name: ai-lab
    restart: unless-stopped
    command: >
      vllm serve ${HF_MODEL_LAB}
      --served-model-name lab
      --gpu-memory-utilization 0.7
      --max-model-len 131072
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: 48gb
    volumes:
      - ${CACHE_LAB}:/root/.cache/huggingface
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  dev:
    # Gemma-4-31B-IT-NVFP4 (~31 GiB NVFP4) — obecný dev LLM; llm-lab sem fallbackuje když lab neběží.
    # Překlady: docker-compose.translate.yaml (vlastní HF_MODEL_TRANSLATE, oddělen od dev).
    # Paměť: model ~31 + KV 8 + overhead ≈ 40 GiB. startup guard: 0.35*128 ≈ 45 GiB required.
    # Po tune-image CUDA driver může držet reserved pages — pokud start selže, snižit na 0.28.
    # Thinking vypnuto by default v litellm (enable_thinking: false); klient může zapnout.
    # tool-call-parser: Gemma-4 používá pythonic formát; ověřit pokud tool calling nefunguje.
    image: nvcr.io/nvidia/vllm:${VLLM_VERSION}
    container_name: ai-dev
    restart: unless-stopped
    command: >
      ${HF_MODEL_DEV}
      --served-model-name dev
      --kv-cache-memory-bytes 8589934592
      --gpu-memory-utilization 0.35
      --max-model-len 32768
      --max-num-seqs 8
      --enable-auto-tool-choice
      --tool-call-parser pythonic
      --trust-remote-code
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
    ports:
      - "127.0.0.1:8001:8000"
    shm_size: 16gb
    volumes:
      - ${CACHE_DEV}:/root/.cache/huggingface
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai-litellm
    restart: unless-stopped
    command: --config /app/config.yaml --port 4000
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      dev:
        condition: service_healthy

networks:
  internal:
    external: true
    name: ai
