# LLM module: vLLM lab + vLLM dev + LiteLLM gateway
#
# Standalone: docker compose -f deploy/docker-compose.llm.yaml up -d
# Env vars:   HF_TOKEN, VLLM_VERSION, HF_MODEL_LAB, HF_MODEL_DEV, CACHE_LAB, CACHE_DEV
#             Fallback:  SWARM_VLLM_VERSION, HF_MODEL_FALLBACK, CACHE_FALLBACK
#             Překlady:  HF_MODEL_TRANSLATE, CACHE_TRANSLATE (docker-compose.translate.yaml)

services:

  lab:
    # Llama-3.3-Nemotron-Super-49B-v1.5 NIM — nejsilnější model, spouštět jen na vyžádání.
    # llm-lab alias v LiteLLM míří primárně sem, fallbackuje na dev (Gemma) a další stacky.
    profiles: ["lab"]
    image: nvcr.io/nim/nvidia/llama-3.3-nemotron-super-49b-v1.5:latest
    container_name: lab
    restart: unless-stopped
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_SERVED_MODEL_NAME=lab
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: 48gb
    volumes:
      - ${CACHE_LAB}:/opt/nim/.cache
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  dev:
    # Llama-3.1-8B-Instruct NIM — obecný dev LLM; llm-lab sem fallbackuje když lab neběží.
    image: nvcr.io/nim/meta/llama-3.1-8b-instruct:2.0.6
    container_name: dev
    restart: unless-stopped
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_SERVED_MODEL_NAME=dev
    ports:
      - "127.0.0.1:8001:8000"
    shm_size: 16gb
    volumes:
      - ${CACHE_DEV}:/opt/nim/.cache
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  fallback:
    # LiquidAI/LFM2.5-350M — nejmenší/nejrychlejší model, VŽDY resident (~1 GB).
    # Poslední článek fallback řetězce v LiteLLM: když spadne lab/dev/translate/
    # swarm-coder/director, odpoví aspoň tenhle. Rychlá edge inference.
    # Pozn.: nouzová náhrada s použitelnou češtinou (Qwen3-4B-AWQ ~2,5 GB vah).
    # 0.08/16384: KV pro 16k kontext (RAG requesty) ≈ 2,4 GiB — do 0.05 se nevešla.
    image: vllm/vllm-openai:${SWARM_VLLM_VERSION}
    container_name: fallback
    restart: unless-stopped
    command: >
      ${HF_MODEL_FALLBACK}
      --served-model-name fallback
      --gpu-memory-utilization 0.08
      --max-model-len 16384
      --max-num-seqs 8
      --trust-remote-code
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
    ports:
      - "127.0.0.1:8002:8000"
    shm_size: 2gb
    volumes:
      - ${CACHE_FALLBACK}:/root/.cache/huggingface/hub
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    command: --config /app/config.yaml --port 4000
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  internal:
    external: true
    name: ai
