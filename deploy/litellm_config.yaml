litellm_settings:
  drop_params: true
  drop_streaming_with_functions: true

model_list:
  # Obě jména míří na jedinou instanci (service 'dev' = Nemotron-3-Nano, served-model-name 'dev').
  # Nano je reasoning model — thinking vypnuto by default (chat app chce přímé odpovědi, ne <think>).
  # Klient může reasoning zapnout posláním chat_template_kwargs.enable_thinking=true.
  - model_name: llm-lab
    litellm_params:
      model: openai/dev
      api_base: http://dev:8000/v1
      api_key: dummy
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: llm-dev
    litellm_params:
      model: openai/dev
      api_base: http://dev:8000/v1
      api_key: dummy
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # Card Forge image-tune stack (docker-compose.tune-image.yaml) — služby běží jen
  # během fáze 'train' (make up-tune-image); jinak routy vrací 502, což nevadí.
  - model_name: builder
    litellm_params:
      model: openai/builder
      api_base: http://tune-builder:8000/v1
      api_key: dummy
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: validator
    litellm_params:
      model: openai/validator
      api_base: http://tune-validator:8000/v1
      api_key: dummy
