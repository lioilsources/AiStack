litellm_settings:
  drop_params: true
  drop_streaming_with_functions: true

router_settings:
  # llm-lab zkouší každý backend jednou — při connection refused přejde na další.
  num_retries: 0
  timeout: 5

model_list:
  # llm-lab: "best available LLM" alias s fallback chainem napříč stacky.
  # LiteLLM zkouší entries v pořadí; nedostupný backend (connection refused) přeskočí.
  # Priorita: lab (gpt-oss-120b) → dev (Gemma-4-31B) → tune-builder (Nemotron-30B)
  #           → translate (Qwen3-32B) → swarm-director (Nemotron-120B, on-demand)
  #
  # thinking vypnuto by default; klient zapne přes chat_template_kwargs.enable_thinking=true.

  # 1. lab service — gpt-oss-120b (profile: lab, spouštět: make up-lab)
  - model_name: llm-lab
    litellm_params:
      model: openai/lab
      api_base: http://lab:8000/v1
      api_key: dummy
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # 2. dev service — Gemma-4-31B-IT-NVFP4 (vždy běží se stackem)
  - model_name: llm-lab
    litellm_params:
      model: openai/dev
      api_base: http://dev:8000/v1
      api_key: dummy
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # 3. tune-builder — Nemotron-Nano-30B (běží jen při make up-tune-image)
  - model_name: llm-lab
    litellm_params:
      model: openai/builder
      api_base: http://tune-builder:8000/v1
      api_key: dummy
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # 4. translate — Qwen3-32B-AWQ (běží jen při make up-translate)
  - model_name: llm-lab
    litellm_params:
      model: openai/translate
      api_base: http://translate:8000/v1
      api_key: dummy
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # 5. swarm-director — Nemotron-Super-120B (on-demand, profile: director)
  - model_name: llm-lab
    litellm_params:
      model: openai/swarm-director
      api_base: http://swarm-director:8000/v1
      api_key: dummy
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # llm-dev: dev service (Gemma-4-31B-IT-NVFP4)
  - model_name: llm-dev
    litellm_params:
      model: openai/dev
      api_base: http://dev:8000/v1
      api_key: dummy
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # Translate stack (docker-compose.translate.yaml) — hromadné překlady, 32 souběžných sekvencí.
  # Spustit: make up-translate
  - model_name: llm-translate
    litellm_params:
      model: openai/translate
      api_base: http://translate:8000/v1
      api_key: dummy
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # Card Forge image-tune stack (docker-compose.tune-image.yaml) — služby běží jen
  # během fáze 'train' (make up-tune-image); jinak routy vrací 502, což nevadí.
  - model_name: builder
    litellm_params:
      model: openai/builder
      api_base: http://tune-builder:8000/v1
      api_key: dummy
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: validator
    litellm_params:
      model: openai/validator
      api_base: http://tune-validator:8000/v1
      api_key: dummy
