litellm_settings:
  drop_params: true
  drop_streaming_with_functions: true

router_settings:
  num_retries: 0
  # 300: dlouhé RAG dotazy (knihovní chatbot) běží na translate i ~4 min;
  # 120s router timeout je stínal a tiše přepadal na fallback
  timeout: 300
  # 'fallback' (LiquidAI/LFM2.5-350M) je vždy-běžící poslední záchrana — na konci
  # každého řetězce, aby klient dostal odpověď místo 5xx, i když spadne poslední článek.
  fallbacks:
    - lab: ["dev", "swarm-coder", "translate", "fallback"]
    - dev: ["swarm-coder", "translate", "fallback"]
    - swarm-coder: ["translate", "fallback"]
    # V noci jede knihovna na swarm-directorovi (obohacení korpusu) a translate
    # je shozený, aby se do 121,7 GiB vešel. Chat tedy sáhne na directora —
    # jeho čeština je měřitelně lepší (A/B na 30 chuncích: translate psal
    # „staroslovanský epos" o Beowulfovi, director „anglosaský"). Teprve když
    # neběží ani ten, přijde na řadu 4B nouzovka.
    # translate je od 2026-10-01 mimo rozvrh (PLAN-spark-scheduler.md): chat Knihovníka jde na
    # qwen36 (okno llm 17–01), v noci na directora, jinak nouzový fallback
    - translate: ["openclaw-default", "swarm-director", "fallback"]
    - pravnik-agent: ["openclaw-default", "fallback"]
    - swarm-director: ["fallback"]
    - shop: ["fallback"]

model_list:
  # ── Agent — OpenClaw / PromoClown (docker-compose.agent.yaml, rezidentní) ─────
  # Qwen3.6-35B-A3B NVFP4. Bez fallbacku: jiný model by rozbil tool calling a
  # OpenClaw cron běh při nedostupném modelu sám přeskočí. Sampling = Qwen
  # doporučení pro non-thinking; halucinuje-li argumenty toolů, temperature 0.2.
  - model_name: openclaw-default
    litellm_params:
      model: openai/qwen36-agent
      api_base: http://qwen36-agent:8000/v1
      api_key: dummy
      timeout: 300
      temperature: 0.6
      top_p: 0.8
      extra_body:
        top_k: 20
        chat_template_kwargs:
          enable_thinking: false

  - model_name: lab
    litellm_params:
      model: openai/lab
      api_base: http://lab:8000/v1
      api_key: dummy
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: dev
    litellm_params:
      model: openai/dev
      api_base: http://dev:8000/v1
      api_key: dummy
      timeout: 300
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: translate
    litellm_params:
      model: openai/translate
      api_base: http://translate:8000/v1
      api_key: dummy
      timeout: 300
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: tune-builder
    litellm_params:
      model: openai/tune-builder
      api_base: http://tune-builder:8000/v1
      api_key: dummy
      timeout: 300
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: tune-validator
    litellm_params:
      model: openai/tune-validator
      api_base: http://tune-validator:8000/v1
      api_key: dummy
      timeout: 300

  - model_name: swarm-coder
    litellm_params:
      model: openai/swarm-coder
      api_base: http://swarm-coder:8000/v1
      api_key: dummy
      timeout: 300

  # ── Image NIM — FLUX modely (přepínatelné, port 8030) ──────────
  - model_name: flux-schnell
    litellm_params:
      model: openai/flux-schnell
      api_base: http://flux-schnell:8000/v1
      api_key: dummy
      timeout: 120

  - model_name: flux-kontext
    litellm_params:
      model: openai/flux-kontext
      api_base: http://flux-kontext:8000/v1
      api_key: dummy
      timeout: 120

  - model_name: flux-dev
    litellm_params:
      model: openai/flux-dev
      api_base: http://flux-dev:8000/v1
      api_key: dummy
      timeout: 120

  - model_name: swarm-director
    litellm_params:
      model: openai/swarm-director
      api_base: http://swarm-director:8000/v1
      api_key: dummy
      timeout: 300
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # ── Fallback — LiquidAI/LFM2.5-350M, vždy resident, poslední záchrana ──────────
  # Qwen3 rodina jako translate → enable_thinking:false patří i sem.
  - model_name: fallback
    litellm_params:
      model: openai/fallback
      api_base: http://fallback:8000/v1
      api_key: dummy
      timeout: 120
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # ── Model bench (PLAN-model-bench.md) ───────────────────────────────────────
  # Neutrální aliasy pro srovnání: stejná teplota, thinking vyp., BEZ fallbacků
  # (router_settings.fallbacks je nezná, takže se model tiše nepřehodí).
  # Produkční aliasy (openclaw-default 0.6/0.8, translate…) se nemění.
  - model_name: bench-qwen36
    litellm_params: {model: openai/qwen36-agent, api_base: "http://qwen36-agent:8000/v1", api_key: dummy, timeout: 600, temperature: 0.2, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - model_name: bench-qwen36-think
    litellm_params: {model: openai/qwen36-agent, api_base: "http://qwen36-agent:8000/v1", api_key: dummy, timeout: 900, temperature: 0.6, extra_body: {chat_template_kwargs: {enable_thinking: true}}}
  - model_name: bench-translate
    litellm_params: {model: openai/translate, api_base: "http://translate:8000/v1", api_key: dummy, timeout: 600, temperature: 0.2, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - model_name: bench-nano
    litellm_params: {model: openai/swarm-nano, api_base: "http://swarm-nano:8000/v1", api_key: dummy, timeout: 600, temperature: 0.2, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - model_name: bench-director
    litellm_params: {model: openai/swarm-director, api_base: "http://swarm-director:8000/v1", api_key: dummy, timeout: 900, temperature: 0.2, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  - model_name: bench-gemma
    litellm_params: {model: openai/gemma, api_base: "http://bench-gemma:8000/v1", api_key: dummy, timeout: 600, temperature: 0.2}
  - model_name: bench-llama33
    litellm_params: {model: openai/llama33, api_base: "http://bench-llama33:8000/v1", api_key: dummy, timeout: 1800, temperature: 0.2}
  # Agent Právníka (rag/agent ve WorldLibraryProject): Gemma-4 na vyžádání
  # (rag-schedule.sh gemma), jinak fallback na qwen36 — bench C1 92/100 %, injection 100 %.
  - model_name: pravnik-agent
    litellm_params: {model: openai/gemma, api_base: "http://bench-gemma:8000/v1", api_key: dummy, timeout: 900, temperature: 0.2}
  # VL soudce pro ShaderGen v2 (Fáze 5) — deploy/docker-compose.vl.yaml
  - model_name: vl
    litellm_params: {model: openai/vl, api_base: "http://vl:8000/v1", api_key: dummy, timeout: 300, temperature: 0.1}

  # ── OCR — Qwen2.5-VL-7B přes vLLM (VLM, image_url v chat/completions) ──────────
  # On-demand (controller: /ctrl/activate?model=ocr). Appka volá model "ocr".
  # Default sampling params proti zacyklení Qwenu na tabulkových/matričních skenech
  # (bez nich greedy dekódování opakuje řádky). Klient je může přebít. TrOCR je ignoruje.
  - model_name: ocr
    litellm_params:
      model: openai/ocr
      api_base: http://ocr-api:8000/v1
      api_key: dummy
      timeout: 300
      temperature: 0.1
      frequency_penalty: 0.6
      presence_penalty: 0.4

  # ── Shopify (ChatShop) — chat + embeddingy (docker-compose.shopify.yaml) ───────
  # shop = Qwen3-32B-FP4 (RAG chat asistent + extrakce atributů při ingestu)
  - model_name: shop
    litellm_params:
      model: openai/shop
      api_base: http://shop:8000/v1
      api_key: dummy
      timeout: 300
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # shop-embed = BAAI/bge-m3 (1024 dim) — /v1/embeddings
  - model_name: shop-embed
    litellm_params:
      model: openai/shop-embed
      api_base: http://shop-embed:8000/v1
      api_key: dummy
      timeout: 60
    model_info:
      mode: embedding

general_settings:
  # ── NIM pass-through — nativní /v1/infer endpoint ──────────────────────────
  # Volání: POST http://localhost:4000/nim/flux-schnell/v1/infer
  #         POST http://localhost:4000/nim/flux-kontext/v1/infer
  #         POST http://localhost:4000/nim/flux-dev/v1/infer
  pass_through_endpoints:
    - path: "/nim/flux-schnell/v1/infer"
      target: "http://flux-schnell:8000/v1/infer"
      headers: {}

    - path: "/nim/flux-kontext/v1/infer"
      target: "http://flux-kontext:8000/v1/infer"
      headers: {}

    - path: "/nim/flux-dev/v1/infer"
      target: "http://flux-dev:8000/v1/infer"
      headers: {}
