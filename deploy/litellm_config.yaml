litellm_settings:
  drop_params: true
  drop_streaming_with_functions: true

router_settings:
  num_retries: 0
  timeout: 5
  fallbacks:
    - lab: ["dev"]

model_list:
  - model_name: lab
    litellm_params:
      model: openai/lab
      api_base: http://lab:8000/v1
      api_key: dummy
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: dev
    litellm_params:
      model: openai/dev
      api_base: http://dev:8000/v1
      api_key: dummy
      timeout: 300
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: translate
    litellm_params:
      model: openai/translate
      api_base: http://translate:8000/v1
      api_key: dummy
      timeout: 300
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: tune-builder
    litellm_params:
      model: openai/tune-builder
      api_base: http://tune-builder:8000/v1
      api_key: dummy
      timeout: 300
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: tune-validator
    litellm_params:
      model: openai/tune-validator
      api_base: http://tune-validator:8000/v1
      api_key: dummy
      timeout: 300

  - model_name: swarm-director
    litellm_params:
      model: openai/swarm-director
      api_base: http://swarm-director:8000/v1
      api_key: dummy
      timeout: 300
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
