# AiStack — root deployment entrypoint (infra: LLM + gateway + controller + Cloudflare)
#
# Client services (ocr-api) live in their own repos and join the
# 'ai' Docker network declared here. Image generation is served separately by
# ComfyUI on the host (comfyui.ol1n.com), not through this gateway.
#
# Full stack:    docker compose -f deploy/docker-compose.yml up -d
# LLM only:      docker compose -f deploy/docker-compose.llm.yaml up -d
#
# Requires: ../.env (copy from ../.env.example and fill in secrets)

include:
  - path: docker-compose.llm.yaml

services:

  controller:
    build:
      context: ../services/controller-manager
    image: aistack/controller:latest
    container_name: ai-controller
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - INFERENCE_CONFIG=/config/models.yaml
      - INFERENCE_STATE=/var/lib/controller/state.json
      - INFERENCE_ADDR=:8090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../services/controller-manager/config:/config:ro
      # Compose soubory řízených stacků — identická cesta host↔kontejner,
      # protože 'docker compose' běží uvnitř kontejneru, ale bind-mount zdroje
      # předává hostovskému daemonu přes docker.sock (cesty se musí shodovat).
      - /home/ol1n/deploy/AiStack/deploy:/home/ol1n/deploy/AiStack/deploy:ro
      - controller-state:/var/lib/controller
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  # ─────────────────────────────────────────────
  # gen-queue — robustní Go job queue pro NIM image generation
  # Nahrazuje nim-kontext-proxy: FLUX Kontext (img2img) + FLUX Schnell (txt2img).
  # Cloudflare routuje llm.ol1n.com/nim/* přímo sem (port 8091).
  # Přijme request, vrátí job_id (202), zpracuje přes worker pool s retry.
  # ─────────────────────────────────────────────
  gen-queue:
    build:
      context: ../services/gen-queue
    image: aistack/gen-queue:latest
    container_name: ai-gen-queue
    restart: unless-stopped
    environment:
      - NIM_KONTEXT_URL=http://flux-kontext:8000/v1/infer
      - NIM_SCHNELL_URL=http://flux-schnell:8000/v1/infer
      - NIM_KONTEXT_WORKERS=${NIM_KONTEXT_WORKERS:-1}
      - NIM_SCHNELL_WORKERS=${NIM_SCHNELL_WORKERS:-1}
      - RESULT_TTL_SECONDS=${RESULT_TTL_SECONDS:-3600}
      - LISTEN_ADDR=:8091
      # UGC tovarna (koncept -> cleanplate -> TRELLIS -> push na NAS po LAN)
      - UGC_COMFY_URL=${UGC_COMFY_URL:-http://host.docker.internal:8188}
      - UGC_NAS_URL=${UGC_NAS_URL:-http://192.168.88.88:8095}
      - UGC_CHECKPOINT=${UGC_CHECKPOINT:-Illustrious-XL-v2.0.safetensors}
      - UGC_SPOOL=/spool
    volumes:
      - ugc-spool:/spool
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:8091"   # LAN: NAS reroll/generate proxy (ugc-api -> /ugc/generate)
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: ../gateway
    image: aistack/gateway:latest
    container_name: ai-gateway
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      - LITELLM_URL=http://litellm:4000
      - OCR_API_URL=http://ocr-api:8000
      - CONTROLLER_URL=http://controller:8090
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────
  # Cloudflare Tunnel — exposes gateway at llm.ol1n.com
  # Credentials + config in ../cloudflared/
  # ─────────────────────────────────────────────
  cloudflared-1:
    image: cloudflare/cloudflared:latest
    container_name: ai-cloudflared-1
    restart: unless-stopped
    command: tunnel --loglevel debug --config /etc/cloudflared/config.yml run
    volumes:
      - ../cloudflared:/etc/cloudflared:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
    depends_on:
      gateway:
        condition: service_healthy

  cloudflared-2:
    image: cloudflare/cloudflared:latest
    container_name: ai-cloudflared-2
    restart: unless-stopped
    command: tunnel --loglevel debug --config /etc/cloudflared/config.yml run
    volumes:
      - ../cloudflared:/etc/cloudflared:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
    depends_on:
      gateway:
        condition: service_healthy

networks:
  internal:
    driver: bridge
    name: ai

volumes:
  ugc-spool:
  controller-state:
