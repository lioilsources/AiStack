# AiStack — root deployment entrypoint (infra: LLM + gateway + Cloudflare)
#
# Client services (image-api, ocr-api) live in their own repos and join the
# 'ai' Docker network declared here.
#
# Full stack:    docker compose -f deploy/docker-compose.yml up -d
# LLM only:      docker compose -f deploy/docker-compose.llm.yaml up -d
#
# Requires: ../.env (copy from ../.env.example and fill in secrets)

include:
  - path: docker-compose.llm.yaml

services:

  gateway:
    build:
      context: ../gateway
    image: aistack/gateway:latest
    container_name: ai-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - LITELLM_URL=http://litellm:4000
      - IMAGE_API_URL=http://image-api:8002
      - OCR_API_URL=http://ocr-api:8003
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────
  # Cloudflare Tunnel — exposes gateway at llm.ol1n.com
  # Credentials + config in ../cloudflared/
  # ─────────────────────────────────────────────
  cloudflared-1:
    image: cloudflare/cloudflared:latest
    container_name: ai-cloudflared-1
    restart: unless-stopped
    command: tunnel --loglevel debug --config /etc/cloudflared/config.yml run
    volumes:
      - ../cloudflared:/etc/cloudflared:ro
    networks:
      - internal
    depends_on:
      gateway:
        condition: service_healthy

  cloudflared-2:
    image: cloudflare/cloudflared:latest
    container_name: ai-cloudflared-2
    restart: unless-stopped
    command: tunnel --loglevel debug --config /etc/cloudflared/config.yml run
    volumes:
      - ../cloudflared:/etc/cloudflared:ro
    networks:
      - internal
    depends_on:
      gateway:
        condition: service_healthy

networks:
  internal:
    driver: bridge
    name: ai
