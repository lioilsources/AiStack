# AiStack — root deployment entrypoint (infra: LLM + gateway + controller + Cloudflare)
#
# Client services (ocr-api) live in their own repos and join the
# 'ai' Docker network declared here. Image generation is served separately by
# ComfyUI on the host (comfyui.ol1n.com), not through this gateway.
#
# Full stack:    docker compose -f deploy/docker-compose.yml up -d
# LLM only:      docker compose -f deploy/docker-compose.llm.yaml up -d
#
# Requires: ../.env (copy from ../.env.example and fill in secrets)

include:
  - path: docker-compose.llm.yaml

services:

  controller:
    build:
      context: ../services/controller-manager
    image: aistack/controller:latest
    container_name: ai-controller
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - INFERENCE_CONFIG=/config/models.yaml
      - INFERENCE_STATE=/var/lib/controller/state.json
      - INFERENCE_ADDR=:8090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../services/controller-manager/config:/config:ro
      # Compose soubory řízených stacků — identická cesta host↔kontejner,
      # protože 'docker compose' běží uvnitř kontejneru, ale bind-mount zdroje
      # předává hostovskému daemonu přes docker.sock (cesty se musí shodovat).
      - /home/ol1n/deploy/AiStack/deploy:/home/ol1n/deploy/AiStack/deploy:ro
      - controller-state:/var/lib/controller
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  gateway:
    build:
      context: ../gateway
    image: aistack/gateway:latest
    container_name: ai-gateway
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      - LITELLM_URL=http://litellm:4000
      - OCR_API_URL=http://ocr-api:8000
      - CONTROLLER_URL=http://controller:8090
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────
  # nim-kontext-proxy — async wrapper pro FLUX.1-Kontext NIM
  # Cloudflare routuje llm.ol1n.com/nim/flux-kontext/* sem (port 8004).
  # Proxy přijme request, vrátí job_id (202), a zpracuje asynchronně —
  # obchází 100s timeout Cloudflare edge pro dlouhé NIM inference.
  # ─────────────────────────────────────────────
  nim-kontext-proxy:
    build:
      context: ../services/nim-kontext-proxy
    image: aistack/nim-kontext-proxy:latest
    container_name: nim-kontext-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8015:8004"
    environment:
      - NIM_KONTEXT_URL=http://flux-kontext:8000
      - JOB_TTL=3600
      - OUTPUT_DIR=/output
    volumes:
      - ../outputs/nim-kontext:/output
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────
  # Cloudflare Tunnel — exposes gateway at llm.ol1n.com
  # Credentials + config in ../cloudflared/
  # ─────────────────────────────────────────────
  cloudflared-1:
    image: cloudflare/cloudflared:latest
    container_name: ai-cloudflared-1
    restart: unless-stopped
    command: tunnel --loglevel debug --config /etc/cloudflared/config.yml run
    volumes:
      - ../cloudflared:/etc/cloudflared:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
    depends_on:
      gateway:
        condition: service_healthy

  cloudflared-2:
    image: cloudflare/cloudflared:latest
    container_name: ai-cloudflared-2
    restart: unless-stopped
    command: tunnel --loglevel debug --config /etc/cloudflared/config.yml run
    volumes:
      - ../cloudflared:/etc/cloudflared:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
    depends_on:
      gateway:
        condition: service_healthy

networks:
  internal:
    driver: bridge
    name: ai

volumes:
  controller-state:
