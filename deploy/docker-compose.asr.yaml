# ASR — přepis řeči: Whisper large-v3-turbo na vLLM, OpenAI-kompatibilní
# POST /v1/audio/transcriptions (multipart: file, model, language). V LiteLLM alias `asr`.
# Volá AlienMatch (denní check-in: 10–20 s AAC 16 kHz mono), obecně pro krátké nahrávky.
#
# ~6 GiB (util 0.05 z 121; váhy ~1,6 GB). Vejde se vedle ComfyUI, vl i qwen36.
# Váhy: `make download-whisper` (cache/whisper), start jen s HF_HUB_OFFLINE=1.
# Broker: doplněk `asr` (services/spark-broker/deploy/config.example.yaml).
#
#   make up-asr  /  make down-asr
services:
  asr:
    image: vllm/vllm-openai:${SWARM_VLLM_VERSION}
    container_name: asr
    command: >
      openai/whisper-large-v3-turbo
      --served-model-name asr
      --gpu-memory-utilization 0.05
      --max-model-len 448
      --max-num-seqs 4
      --task transcription
    environment:
      - HF_HUB_OFFLINE=1
    volumes:
      - ${CACHE_WHISPER}:/root/.cache/huggingface/hub:ro
    ports:
      - "127.0.0.1:8042:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [ai]
    restart: "no"

networks:
  ai:
    external: true
    name: ai
