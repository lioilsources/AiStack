# SPARK OOM guard — kernelové rezervy a swap tuning (spark/README.md).

# Magic SysRq celé (Alt+SysRq+F ruční OOM kill, REISUB bezpečný reboot).
# /proc/sysrq-trigger funguje i bez toho; tohle je pro klávesnici.
kernel.sysrq = 1

# 1 GiB vždy volný — kernel začne reclaimovat dřív, sshd a guard mají kde alokovat.
vm.min_free_kbytes = 1048576
# Rezervy pro root/uživatele. Uplatní se jen s overcommit_memory=2, které
# nepoužíváme (rozbíjí CUDA alokace) — nechány kvůli případné změně.
vm.admin_reserve_kbytes = 524288
vm.user_reserve_kbytes = 1048576
vm.overcommit_memory = 0
vm.panic_on_oom = 0
vm.oom_kill_allocating_task = 0

# zram je rychlý → swapovat klidně agresivně, po stránkách.
vm.swappiness = 150
vm.page-cluster = 0
vm.watermark_boost_factor = 0
# ~1,5 GiB mezi watermarky: kswapd začne dřív. MemAvailable tím klesne o ~3,5 GiB
# (odečítá high watermark) — noční 95 GiB změřeno už s tímto nastavením.
vm.watermark_scale_factor = 125
